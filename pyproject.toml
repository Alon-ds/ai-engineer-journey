[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineer-journey"
version = "0.1.0"
description = "Learning journey from beginner programmer to professional AI Backend Engineer."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alon-ds" }]
license = { text = "MIT" }
keywords = ["python", "fastapi", "ai", "rag", "backend", "learning"]

[project.optional-dependencies]
dev = [
  "black>=24.4.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
